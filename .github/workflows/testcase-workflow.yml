name: Testcase workflow

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "tools/testcase-workflow/**"
      - ".github/workflows/testcase-workflow.yml"
      - "frontend/tests/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/tests/**"
      - "backend/**/*.csproj"
  push:
    paths:
      - "tools/testcase-workflow/**"
      - ".github/workflows/testcase-workflow.yml"
      - "frontend/tests/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/tests/**"
      - "backend/**/*.csproj"
  workflow_dispatch:
    inputs:
      force_sheets_sync:
        description: "Run protected Google Sheets sync"
        required: false
        default: false
        type: boolean

jobs:
  workflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow dependencies
        run: python -m pip install -r tools/testcase-workflow/requirements.txt
      - name: Validate workflow syntax
        run: python -m py_compile tools/testcase-workflow/workflow.py tools/testcase-workflow/sheets_client.py tools/testcase-workflow/validate_results.py
      - name: Run workflow smoke tests
        run: python -m unittest tools.testcase-workflow.test_workflow tools.testcase-workflow.test_sheets_client -v
      - name: Run idempotent dry run
        run: python tools/testcase-workflow/workflow.py sync --dry-run
      - name: Verify credential files are ignored
        shell: bash
        run: |
          test "$(git check-ignore --no-index angelic-tracer-477405-b6-4e7d814654bf.json)" = "angelic-tracer-477405-b6-4e7d814654bf.json"
          ! git ls-files -z | grep -Eiq '(^|/)(service-account|google-credentials|angelic-tracer-.*)\.json$'

  playwright-contract:
    needs: [workflow-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir -p ../.cache
          nohup pnpm run start > ../.cache/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/diagnose >/dev/null && exit 0; sleep 2; done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow dependencies
        run: python -m pip install -r tools/testcase-workflow/requirements.txt
      - name: Install browser test dependency
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Run configured Playwright group
        env:
          AGRIVISION_RESULT_DIR: .cache/test-results/playwright
        run: python tools/testcase-workflow/workflow.py run playwright
      - name: Upload Playwright results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testcase-playwright-results
          path: |
            .cache/test-results/playwright
            .cache/diagnosis-errors
          if-no-files-found: warn

  backend-tests:
    needs: [workflow-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore and run API tests
        env:
          AGRIVISION_RESULT_DIR: .cache/test-results/backend
        run: |
          docker info --format '{{.ServerVersion}}'
          dotnet restore backend/tests/AgriVision.ApiTests/AgriVision.ApiTests.csproj
          python tools/testcase-workflow/workflow.py run api
      - name: Upload backend results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testcase-backend-results
          path: .cache/test-results/backend
          if-no-files-found: warn

  live-contract:
    needs: [workflow-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: agriai_ci_password
      JWT_SECRET: agriai_ci_jwt_secret_012345678901234567890123
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: testcase-${{ github.run_id }}-${{ github.run_attempt }}
      AI_TIMEOUT_SECONDS: "120"
      R2_SERVICE_URL: https://ci-test.r2.cloudflarestorage.com
      R2_BUCKET_NAME: agriai-ci-contract
      R2_ACCESS_KEY_ID: ci-contract-access
      R2_SECRET_ACCESS_KEY: ci-contract-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow dependencies
        run: python -m pip install -r tools/testcase-workflow/requirements.txt
      - name: Download and verify AI checkpoints
        run: |
          set -euo pipefail
          mkdir -p .cache/compose ai/models
          curl --fail --location --silent --show-error --max-time 300 \
            "https://drive.usercontent.google.com/download?id=1G7xkhJE-ZXVIXHoBn11wbSZayQk1Cm6V&export=download&authuser=0&confirm=t" \
            --output .cache/ai-model.rar
          echo "a55ee86d1f57a44c93a3a0b09f91cd6493490c4edf0c88c3d9b300d0bb171e72  .cache/ai-model.rar" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
          bsdtar -xf .cache/ai-model.rar -C ai/models --strip-components 1 \
            ai/checkpoints/plant/best_convnext_tiny.pth ai/checkpoints/plant/class_to_idx.json \
            ai/checkpoints/disease/best_convnext_tiny.pth ai/checkpoints/disease/class_to_idx.json
          echo "d071c13d14ef573430b38674647e5ebfce0b5d3f4bd7099d7e815549073178ea  ai/models/checkpoints/plant/best_convnext_tiny.pth" | sha256sum --check
          echo "d21d8d6efd3c66e36ce166bfdb03bf0f017a0452ee07508df82e49ca42d429b9  ai/models/checkpoints/disease/best_convnext_tiny.pth" | sha256sum --check
      - name: Start backend contract stack
        run: |
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 180
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:5080/api/health >/dev/null && exit 0; sleep 2; done
          docker compose logs --no-color backend ai-service postgres migrations
          exit 1
      - name: Run live API adapters
        env:
          AGRIVISION_RESULT_DIR: .cache/test-results/contracts
        run: |
          python tools/testcase-workflow/workflow.py run-case API-HEALTH-01
          python tools/testcase-workflow/workflow.py run-case API-PRED-GUEST-01
      - name: Upload live contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testcase-live-contract-results
          path: .cache/test-results/contracts
          if-no-files-found: warn
      - name: Stop contract stack
        if: ${{ always() }}
        run: docker compose down -v
  frontend-tests:
    needs: [workflow-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        working-directory: frontend
        env:
          AGRIVISION_RESULT_DIR: ../.cache/test-results/frontend
        run: python ../tools/testcase-workflow/workflow.py run screen
      - name: Upload frontend results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testcase-frontend-results
          path: .cache/test-results/frontend
          if-no-files-found: warn

  test-result-summary:
    needs: [backend-tests, frontend-tests, playwright-contract, live-contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: .cache/test-results
      - name: Validate result artifacts
        run: |
          python tools/testcase-workflow/validate_results.py .cache/test-results \
            --expected-id RUN-api \
            --expected-id RUN-screen \
            --expected-id RUN-playwright \
            --expected-id API-HEALTH-01 \
            --expected-id API-PRED-GUEST-01

  sheets-sync:
    needs: [test-result-summary]
    if: ${{ needs.test-result-summary.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AGRIVISION_WRITE_SHEETS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.force_sheets_sync == true)) }}
    runs-on: ubuntu-latest
    environment: testcase-sheets
    concurrency:
      group: google-sheets-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: .cache/test-results
      - name: Install workflow dependencies
        run: python -m pip install -r tools/testcase-workflow/requirements.txt
      - name: Decode Service Account key
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY_BASE64"
          umask 077
          key_path="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GCP_SA_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d.get("client_email") == "sheets-test-runner@angelic-tracer-477405-b6.iam.gserviceaccount.com" and d.get("project_id") == "angelic-tracer-477405-b6"' "$key_path"
          echo "GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE=$key_path" >> "$GITHUB_ENV"
      - name: Sync testcases and latest results
        env:
          AGRIVISION_WRITE_SHEETS: "true"
        run: |
          python tools/testcase-workflow/workflow.py import-results .cache/test-results
          python tools/testcase-workflow/workflow.py sync --sheets
      - name: Remove Service Account key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/google-service-account.json"
