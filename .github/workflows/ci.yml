name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # History through the current checkout is exempt; do not advance this marker.
      COMMITLINT_BASELINE: 727aa59f5b1ded338df09ba338ca13b45c12a864
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate new content commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test .github/scripts/test_lint_commits.cjs
          node .github/scripts/lint_commits.cjs

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          mkdir -p .cache/secret-scan
          docker run --rm --volume "$PWD:/repo:ro" --volume "$PWD/.cache/secret-scan:/reports" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --log-opts="--all" --no-banner --redact --verbose --report-format json --report-path /reports/gitleaks.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: secret-scan-results
          path: .cache/secret-scan/gitleaks.json
          retention-days: 7

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build containers and verify service health
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_HOST_PORT: '55432'
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -hex 32)"
          export POSTGRES_PASSWORD JWT_SECRET
          mkdir -p .cache/compose
          cleanup() {
            result=$?
            docker compose logs --no-color > .cache/compose/services.log 2>&1 || true
            docker compose down --volumes --remove-orphans || true
            return "$result"
          }
          trap cleanup EXIT
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 180
          docker compose exec -T postgres pg_isready -U agrivision_user -d agrivision_db
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:5080/api/health > .cache/compose/api-health.json
          python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] == "Healthy" and h["checks"]["database"] == "Healthy", h' < .cache/compose/api-health.json
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:5080/api/health/deps > .cache/compose/ai-health.json
          python3 -c 'import json,sys; assert json.load(sys.stdin)["checks"]["aiService"] == "Healthy"' < .cache/compose/ai-health.json
          docker compose exec -T backend sh -c 'test -w /app/wwwroot/uploads/predictions'
          docker compose stop ai-health
          test "$(curl --silent --show-error --max-time 15 -o .cache/compose/ai-unavailable.json -w '%{http_code}' http://127.0.0.1:5080/api/health/deps)" = 503
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:5080/api/health > .cache/compose/api-without-ai.json
          python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "Healthy"' < .cache/compose/api-without-ai.json
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > .cache/compose/frontend.html
          grep -q 'LeafAI' .cache/compose/frontend.html
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/health > .cache/compose/proxy-health.json
          python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "Healthy"' < .cache/compose/proxy-health.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-smoke-results
          path: .cache/compose/
          retention-days: 14

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements_ci.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ai/requirements_ci.txt
      - name: Test CI coverage validation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Run all dataset and runtime unit tests
        run: python -m coverage run -m unittest discover -s ai/tasks/agri_21/tests -p 'test_*.py'
      - name: Publish coverage and enforce current Python branch floor
        if: ${{ !cancelled() }}
        run: |
          python -m coverage xml
          python -m coverage html
          python .github/scripts/check_coverage.py .cache/coverage/python/coverage.xml --minimum-branches 40 --label Python
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: .cache/coverage/python/
          retention-days: 14

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Restore and build
        id: build
        run: |
          dotnet restore backend/AgriVision.sln
          dotnet build backend/AgriVision.sln --no-restore --verbosity quiet
      - name: Run unit tests with coverage
        id: unit
        run: dotnet test backend/tests/AgriVision.UnitTests/AgriVision.UnitTests.csproj --no-build --no-restore --settings backend/coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit.trx" --results-directory .cache/coverage/backend/unit --verbosity quiet
      - name: Run API and PostgreSQL integration tests with coverage
        id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker info --format '{{.ServerVersion}}'
          dotnet test backend/tests/AgriVision.IntegrationTests/AgriVision.IntegrationTests.csproj --no-build --no-restore --settings backend/coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFileName=integration.trx" --results-directory .cache/coverage/backend/integration --verbosity quiet
      - name: Verify suites and merge backend coverage
        if: ${{ !cancelled() && steps.unit.outcome == 'success' && steps.integration.outcome == 'success' }}
        run: |
          python3 .github/scripts/check_dotnet_test_results.py .cache/coverage/backend/unit
          python3 .github/scripts/check_dotnet_test_results.py .cache/coverage/backend/integration
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path .cache/dotnet-tools --version 5.5.4
          .cache/dotnet-tools/reportgenerator '-reports:.cache/coverage/backend/**/coverage.cobertura.xml' '-targetdir:.cache/coverage/backend/merged' '-reporttypes:Html;Cobertura'
          python3 .github/scripts/check_coverage.py .cache/coverage/backend/merged/Cobertura.xml --minimum-branches 35 --label Backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: .cache/coverage/backend/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        id: install
      - run: pnpm run lint
      - name: Run all frontend tests and enforce branch coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:coverage
      - name: Build Next.js
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build
      - name: Summarize frontend branch coverage
        if: ${{ !cancelled() }}
        run: python3 ../.github/scripts/check_coverage.py ../.cache/coverage/frontend/cobertura-coverage.xml --minimum-branches 25 --label Frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: .cache/coverage/frontend/
          retention-days: 14

  ci-gate:
    if: always()
    needs: [commitlint, secret-scan, compose-smoke, python-tests, backend-tests, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          sys.exit(0 if results and all(job['result'] == 'success' for job in results.values()) else 1)
          PY
