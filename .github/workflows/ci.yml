name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build containers and verify service health
        env:
          POSTGRES_HOST_PORT: '55432'
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker compose logs --no-color; fi
            docker compose down --remove-orphans
            return "$result"
          }
          trap cleanup EXIT
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 120
          docker compose exec -T postgres pg_isready -U agrivision_user -d agrivision_db
          curl --fail --silent http://127.0.0.1:5080/api/health > "$RUNNER_TEMP/api-health.json"
          python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] == "Healthy" and h["checks"]["database"] == "Healthy" and h["checks"]["aiService"] == "Healthy", h' < "$RUNNER_TEMP/api-health.json"
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:3000/api/health > "$RUNNER_TEMP/proxy-health.json"
          python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "Healthy"' < "$RUNNER_TEMP/proxy-health.json"

  python-smoke:
    needs: service-health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run dependency-free data tests
        run: python -X utf8 -m unittest ai.tasks.agri_21.tests.test_label_mapping ai.tasks.agri_21.tests.test_split_dataset_by_group

  dotnet-unit:
    needs: service-health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Restore and build
        run: |
          dotnet restore backend/AgriVision.sln
          dotnet build backend/AgriVision.sln --no-restore --verbosity quiet
      - name: Run unit tests with coverage
        run: dotnet test backend/tests/AgriVision.UnitTests/AgriVision.UnitTests.csproj --no-build --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit.trx" --results-directory backend/tests/AgriVision.UnitTests/TestResults --verbosity quiet
      - name: Verify executed tests and branch coverage artifact
        run: python3 .github/scripts/check_dotnet_test_results.py backend/tests/AgriVision.UnitTests/TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-unit-results
          path: backend/tests/AgriVision.UnitTests/TestResults/
          if-no-files-found: warn

  dotnet-integration:
    needs: service-health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Verify Docker daemon
        run: docker info --format '{{.ServerVersion}}'
      - name: Run API and PostgreSQL integration tests
        run: dotnet test backend/tests/AgriVision.IntegrationTests/AgriVision.IntegrationTests.csproj --logger "trx;LogFileName=integration.trx" --results-directory backend/tests/AgriVision.IntegrationTests/TestResults --verbosity quiet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-integration-results
          path: backend/tests/AgriVision.IntegrationTests/TestResults/
          if-no-files-found: warn

  frontend:
    needs: service-health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
