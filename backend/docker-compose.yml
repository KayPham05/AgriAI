version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrivision_postgres
    restart: always
    environment:
      POSTGRES_DB: agrivision_db
      POSTGRES_USER: agrivision_user
      POSTGRES_PASSWORD: agrivision_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrivision_user -d agrivision_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
