<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1130" viewBox="0 0 1800 1130" role="img" aria-labelledby="chen-erd-title chen-erd-desc">
  <title id="chen-erd-title">ERD Chen của sáu thực thể AgriVision</title>
  <desc id="chen-erd-desc">Sáu thực thể User, Prediction, Prediction Detail, Plant Disease, Plant và Disease. Hình bầu dục là thuộc tính, hình thoi là quan hệ; các đường nối ghi bội số theo schema hiện tại.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #253341; }
    .heading { font-size: 26px; font-weight: 650; }
    .subheading { font-size: 15px; fill: #62717c; }
    .entity-label { font-size: 18px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
    .attribute-label { font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    .relation-label { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .cardinality { font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .note { font-size: 15px; fill: #62717c; }
    .connector { stroke: #85909a; stroke-width: 1.7; fill: none; }
    .neutral { fill: #f6f7f8; stroke: #7e8790; }
    .blue { fill: #e8f0fd; stroke: #83a3d1; }
    .green { fill: #e6f1e2; stroke: #8cb18f; }
    .entity, .attribute { stroke-width: 1.5; }
    .relation { fill: #fff; stroke: #66737d; stroke-width: 1.5; }
  </style>
