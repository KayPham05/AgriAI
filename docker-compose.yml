services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: agrivision_db
      POSTGRES_USER: agrivision_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -X -w -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -v ON_ERROR_STOP=1 -qAtc 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai
    environment:
      AGRIVISION_DATASET_VERSION: ${AGRIVISION_DATASET_VERSION:-v1.4}
      AGRIVISION_MODEL_VERSION: ${AGRIVISION_MODEL_VERSION:-convnext-tiny-v1.4}
      AGRIVISION_PLANT_CHECKPOINT: /app/ai/models/checkpoints/plant/best_convnext_tiny.pth
      AGRIVISION_DISEASE_CHECKPOINT: /app/ai/models/checkpoints/disease/best_convnext_tiny.pth
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    volumes:
      - ./ai/models/checkpoints:/app/ai/models/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 45s

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=agrivision_db;Username=agrivision_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AiService__BaseUrl: http://ai-service:8000
      AiService__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-15}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${API_HOST_PORT:-5080}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"status\":\"Healthy\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  uploads:
