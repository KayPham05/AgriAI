name: Skill helper checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .agents/skills/devops-iac-engineer/tests -p 'test_*.py' -v
