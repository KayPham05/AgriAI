# CI runs the real AI service from base Compose and applies migrations separately.
services:
  # CI uses a separate, one-shot migration job for its empty database.
  migrations:
    build: ./backend
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=agrivision_db;Username=agrivision_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    depends_on:
      migrations:
        condition: service_completed_successfully
