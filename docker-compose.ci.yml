# Health-only AI stub for container smoke tests. No model inference is tested.
services:
  ai-health:
    image: python:3.12-alpine
    command: ["python", "/app/mock_ai_health.py"]
    environment:
      AI_HEALTH_HOST: 0.0.0.0
    volumes:
      - ./.github/scripts/mock_ai_health.py:/app/mock_ai_health.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    environment:
      AiService__BaseUrl: http://ai-health:8000
    depends_on:
      ai-health:
        condition: service_healthy
